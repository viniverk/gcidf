<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encontre seu GC · Igreja dos Filhos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout 4: Painel. Menu lateral escuro no computador, conteúdo em colunas */
  :root{
    --lateral:#1B1E23; --fundo:#F4F5F7; --cartao:#FFFFFF; --campo:#F4F5F7; --linha:#DDE1E6;
    --texto:#16191D; --suave:#5F6773; --cor:#2F5D8C; --cor-clara:#E6EEF6; --erro:#B3261E;
    --mapa-contorno:#FFFFFF; --mapa-destaque:#2F5D8C; --mapa-outro:#9AA3AE; --mapa-rota:#2F5D8C; --mapa-pessoa:#16191D;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--fundo);color:var(--texto);font-family:"Public Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
  .wrap{max-width:620px;margin:0 auto;padding:0 16px 48px}
  header{display:flex;align-items:center;gap:14px;padding:16px 0}
  header img{width:110px;height:auto;border-radius:12px;flex-shrink:0}
  header h1{font-family:"Sora",system-ui,sans-serif;font-weight:700;font-size:24px;line-height:1.15;margin:0}
  nav{display:flex;gap:4px;margin:4px 0 18px;padding:4px;background:var(--cartao);border-radius:12px;border:1px solid var(--linha)}
  nav button{flex:1;min-width:0;background:none;border:0;padding:10px 6px;border-radius:9px;font:600 15px "Public Sans",sans-serif;color:var(--suave);cursor:pointer}
  nav button[aria-selected="true"]{background:var(--cor);color:#fff}
  section{background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:20px}
  section[hidden]{display:none}
  #tela-carregando{background:none;border:0;padding:0}
  label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
  label small{font-weight:400;color:var(--suave)}
  input,select{width:100%;padding:11px 12px;font:500 16px "Public Sans",sans-serif;border:1px solid var(--linha);border-radius:10px;background:var(--campo);color:var(--texto)}
  input:focus,select:focus{outline:none;border-color:var(--cor);background:var(--cartao);box-shadow:0 0 0 3px var(--cor-clara)}
  button:focus-visible,a:focus-visible{outline:3px solid var(--cor);outline-offset:2px}
  .cep{font-family:"Sora",sans-serif;font-weight:600;font-size:26px;letter-spacing:2px;text-align:center}
  .linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
  .linha-rua{display:grid;grid-template-columns:1fr 96px;gap:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--cor);color:#fff;font:700 16px "Public Sans",sans-serif;cursor:pointer;text-decoration:none}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn.ouro{background:var(--cor);color:#fff}
  .btn.claro{background:var(--cor-clara);color:var(--cor)}
  .msg{margin:14px 0 0;padding:11px 14px;border-radius:10px;background:var(--campo)}
  .msg.erro{background:#FBE9E7;color:var(--erro)}
  .placar{background:var(--lateral);color:#fff;border-radius:16px;overflow:hidden}
  .placar .topo{padding:20px 22px 12px}
  .placar .de{margin:0;color:#A9B0BA;font-size:14px}
  .placar h2{font-family:"Sora",sans-serif;font-weight:700;font-size:32px;line-height:1.1;margin:6px 0 10px;overflow-wrap:anywhere}
  .placar .info{margin:2px 0;color:#D5DAE0}
  .placar .faixa{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:4px 16px 0;padding:14px 16px;background:#fff;color:var(--texto);border-radius:12px}
  .placar .faixa .extra{flex-basis:100%;font-size:14px;color:var(--suave)}
  .placar .km{font-family:"Sora",sans-serif;font-weight:700;font-size:44px;line-height:1;color:var(--cor)}
  .placar .acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 16px}
  .placar .acoes .btn{margin:0;background:rgba(255,255,255,.12);color:#fff}
  .mapa{height:300px;border-radius:14px;margin-top:16px;border:1px solid var(--linha)}
  .mapa.grande{height:calc(100vh - 250px);min-height:380px;margin-top:0}
  .dias{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  #b-dias{display:grid;grid-template-columns:repeat(7,1fr)}
  .dia{flex:1 0 auto;min-width:0;padding:8px 4px;border:1px solid var(--linha);border-radius:9px;background:var(--campo);font:600 14px "Public Sans",sans-serif;color:var(--texto);cursor:pointer}
  .dia[aria-pressed="true"]{background:var(--cor);border-color:var(--cor);color:#fff}
  .editando{margin:0 0 8px;padding:10px 14px;border-radius:10px;background:var(--cor-clara);color:var(--cor);font-weight:700}
  .acoes-item{display:flex;gap:2px;flex-shrink:0}
  .x.editar{color:var(--cor)}
  .opcoes{margin-top:14px}
  .opcoes p{margin:0 0 8px;font-weight:600}
  .opcao{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 14px;border:1px solid var(--linha);border-radius:10px;background:var(--cartao);font:500 15px "Public Sans",sans-serif;color:var(--texto);cursor:pointer}
  .opcao[aria-pressed="true"]{border-color:var(--cor);background:var(--cor-clara)}
  .opcao small{display:block;color:var(--suave)}
  h3{font-family:"Sora",sans-serif;font-weight:700;font-size:18px;margin:24px 0 6px}
  ul.lista{list-style:none;padding:0;margin:0}
  ul.lista li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--linha)}
  ul.lista strong{display:block}
  ul.lista span.sub{color:var(--suave);font-size:14px}
  .dist{font-family:"Sora",sans-serif;font-weight:700;font-size:18px;white-space:nowrap;color:var(--cor)}
  .sair{margin-left:auto}
  .x{background:none;border:0;color:var(--erro);font:600 14px "Public Sans",sans-serif;cursor:pointer;padding:6px}
  .vazio{padding:22px;border:1px dashed var(--linha);border-radius:14px;text-align:center;color:var(--suave)}
  .aviso{font-size:14px;color:var(--suave);margin-top:10px}
  #b-res .placar{margin-top:22px}
  @media (prefers-reduced-motion:no-preference){.placar{animation:entra .35s ease-out}}
  @keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ===== Computador: menu lateral + colunas ===== */
  @media (min-width:980px){
    body::before{content:"";position:fixed;inset:0 auto 0 0;width:250px;background:var(--lateral)}
    .wrap{max-width:none;margin:0 0 0 250px;padding:28px 32px 40px}
    header{position:fixed;top:0;left:0;width:250px;flex-direction:column;align-items:flex-start;gap:10px;padding:24px 22px;z-index:10}
    header img{width:180px;border-radius:0}
    header h1{color:#fff;font-size:20px}
    .sair{position:fixed;left:22px;bottom:22px;margin:0;color:#F2A69D;z-index:10}
    nav{position:fixed;top:190px;left:0;width:250px;flex-direction:column;gap:4px;margin:0;padding:0 14px;background:none;border:0;z-index:10}
    nav button{flex:none;text-align:left;padding:12px 14px;color:#AEB4BD;font-size:16px}
    nav button:hover{background:rgba(255,255,255,.06);color:#fff}
    nav button[aria-selected="true"]{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--mapa-destaque)}
    nav button[aria-selected="true"]{box-shadow:inset 3px 0 0 #8FB4DC}
    #tela-login{max-width:420px;margin:12vh auto 0}
    section{padding:24px}

    /* abas escondidas continuam escondidas mesmo com o grid */
    #aba-buscar[hidden],#aba-gcs[hidden]{display:none}

    /* Buscar: formulário à esquerda, resultado à direita */
    #aba-buscar{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);column-gap:32px;align-items:start}
    #aba-buscar > *{grid-column:1}
    #aba-buscar > #b-res{grid-column:2;grid-row:1 / span 40}
    #b-res .placar{margin-top:0}
    #b-res:empty{display:flex;align-items:center;justify-content:center;min-height:420px;border:1px dashed var(--linha);border-radius:16px}
    #b-res:empty::before{content:"O GC mais próximo aparece aqui";color:var(--suave)}
    #b-res #mapa{height:420px}

    /* GCs: formulário à esquerda, lista à direita */
    #aba-gcs{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);column-gap:32px;align-items:start}
    #aba-gcs > *{grid-column:1}
    #aba-gcs > h3{grid-column:2;grid-row:1;margin-top:0}
    #aba-gcs > #g-lista{grid-column:2;grid-row:2 / span 40}

    /* Pessoas e lista de GCs em colunas */
    #aba-pessoas > select{max-width:360px}
    #p-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:28px}
    .mapa.grande{height:calc(100vh - 150px)}
  }
</style>
</head>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ====== Configuração do Firebase (projeto gcidf-e6312) ====== */
var firebaseConfig = {
  apiKey: "AIzaSyD5VylY34QttVjcKEx7i8qoTDy-Tgt1pmc",
  authDomain: "gcidf-e6312.firebaseapp.com",
  projectId: "gcidf-e6312",
  storageBucket: "gcidf-e6312.firebasestorage.app",
  messagingSenderId: "782850380839",
  appId: "1:782850380839:web:e4c94c8e17c33de48f2a02"
};
/* =============================================================== */

var fbApp = initializeApp(firebaseConfig);
var auth = getAuth(fbApp);
var db = getFirestore(fbApp);
setPersistence(auth, browserLocalPersistence);
var dados = { gcs: [], pessoas: [] };
var ultimaBusca = null;
var mapa = null;
var mapaGcs = null;
var enderecoEscolhido = null;
var opcoesEndereco = [];

/* ---------- armazenamento (Firestore) ---------- */
function semVazios(o) { return JSON.parse(JSON.stringify(o)); }
async function carregar() {
  var g = await getDocs(collection(db, 'gcs'));
  var p = await getDocs(collection(db, 'pessoas'));
  dados.gcs = g.docs.map(function (d) { return d.data(); });
  dados.pessoas = p.docs.map(function (d) { return d.data(); })
    .sort(function (a, b) { return (b.em || '').localeCompare(a.em || ''); });
}
async function gravar(colecao, obj) { await setDoc(doc(db, colecao, obj.id), semVazios(obj)); }
async function apagar(colecao, id) { await deleteDoc(doc(db, colecao, id)); }
function erroFirebase(e) {
  if (e && e.code === 'permission-denied') return 'Sem permissão para salvar. Confira as regras do Firestore e o UID do admin.';
  return 'Não consegui salvar no servidor. Verifique a internet e tente de novo.';
}

/* ---------- dias e horários ---------- */
var DIAS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
var DIAS_CURTOS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
var diasFiltro = [];
var TIPOS = ['Casais', 'Homens', 'Mulheres'];
var tiposFiltro = [];
var editando = null;
function diaDoGc(g) {
  if (g.dia) return g.dia;
  var q = (g.quando || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  for (var i = 0; i < DIAS.length; i++) {
    var d = DIAS[i].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    if (q.indexOf(d.slice(0, 3)) !== -1) return DIAS[i];
  }
  return '';
}
function quandoDe(dia, hora) { return [dia, hora].filter(Boolean).join(', '); }
function montarSelects() {
  $('g-dia').innerHTML = '<option value="">Escolha</option>' + DIAS.map(function (d) { return '<option>' + d + '</option>'; }).join('');
  var horas = ['<option value="">Escolha</option>'];
  for (var m = 6 * 60; m <= 22 * 60; m += 30) {
    var h = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    horas.push('<option>' + h + '</option>');
  }
  $('g-hora').innerHTML = horas.join('');
  $('g-tipo').innerHTML = '<option value="">Escolha</option>' + TIPOS.map(function (x) { return '<option>' + x + '</option>'; }).join('');
  $('b-tipos').innerHTML = TIPOS.map(function (x) {
    return '<button class="dia" type="button" data-tipo="' + x + '" aria-pressed="false">' + x + '</button>';
  }).join('');
  $('b-dias').innerHTML = DIAS.map(function (d, i) {
    return '<button class="dia" type="button" data-dia="' + d + '" aria-pressed="false" title="' + d + '">' + DIAS_CURTOS[i] + '</button>';
  }).join('');
}

/* ---------- cores do mapa vêm do CSS (cada layout define as suas) ---------- */
function corMapa(nome, padrao) {
  var v = getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
  return v || padrao;
}

/* ---------- utilitários ---------- */
function $(id) { return document.getElementById(id); }
function digitos(s) { return (s || '').replace(/\D/g, ''); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function mascaraCep(el) { el.addEventListener('input', function () { var d = digitos(el.value).slice(0, 8); el.value = d.length > 5 ? d.slice(0,5) + '-' + d.slice(5) : d; }); }
function km(n) { return n < 10 ? n.toFixed(1).replace('.', ',') : Math.round(n).toString(); }
function msg(alvo, texto, erro) { $(alvo).innerHTML = texto ? '<p class="msg' + (erro ? ' erro' : '') + '">' + esc(texto) + '</p>' : ''; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function distancia(a, b) {
  var R = 6371, rad = Math.PI / 180;
  var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  var h = Math.sin(dLat/2)**2 + Math.cos(a.lat*rad) * Math.cos(b.lat*rad) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ---------- CEP -> endereço -> coordenadas ---------- */
async function buscarJson(url) {
  var r = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function enderecoDoCep(cep) {
  try {
    var b = await buscarJson('https://brasilapi.com.br/api/cep/v2/' + cep);
    var c = b.location && b.location.coordinates;
    return { rua: b.street, bairro: b.neighborhood, cidade: b.city, uf: b.state,
             coord: c && c.latitude ? { lat: +c.latitude, lng: +c.longitude } : null };
  } catch (e) {
    var v = await buscarJson('https://viacep.com.br/ws/' + cep + '/json/');
    if (v.erro) throw new Error('CEP não encontrado');
    return { rua: v.logradouro, bairro: v.bairro, cidade: v.localidade, uf: v.uf, coord: null };
  }
}
async function nominatim(params) {
  var q = new URLSearchParams(Object.assign({ format: 'json', limit: '1', countrycodes: 'br' }, params));
  var r = await buscarJson('https://nominatim.openstreetmap.org/search?' + q.toString());
  return r && r[0] ? { lat: +r[0].lat, lng: +r[0].lon } : null;
}
async function localizar(cep, numero) {
  cep = digitos(cep);
  if (cep.length !== 8) throw new Error('Digite um CEP com 8 números.');
  var e = await enderecoDoCep(cep);
  var texto = [e.rua && (e.rua + (numero ? ', ' + numero : '')), e.bairro, e.cidade && (e.cidade + '/' + e.uf)].filter(Boolean).join(' - ');
  var p;
  if (e.rua) { p = await nominatim({ street: (numero ? numero + ' ' : '') + e.rua, city: e.cidade, state: e.uf }); if (p) return { coord: p, texto: texto, precisao: 'rua' }; }
  if (e.coord) return { coord: e.coord, texto: texto, precisao: 'rua' };
  if (e.bairro) { p = await nominatim({ q: e.bairro + ', ' + e.cidade + ', ' + e.uf }); if (p) return { coord: p, texto: texto, precisao: 'bairro' }; }
  p = await nominatim({ city: e.cidade, state: e.uf });
  if (p) return { coord: p, texto: texto, precisao: 'cidade' };
  throw new Error('Achei o endereço, mas não a localização no mapa. Tente outro CEP.');
}

/* ---------- abas ---------- */
function trocarAba(nome) {
  document.querySelectorAll('nav button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.aba === nome ? 'true' : 'false'); });
  ['buscar', 'mapa', 'pessoas', 'gcs'].forEach(function (n) { $('aba-' + n).hidden = n !== nome; });
  if (nome === 'pessoas') renderPessoas();
  if (nome === 'gcs') renderGcs();
  if (nome === 'mapa') setTimeout(desenharMapaTodos, 30);
  if (nome === 'buscar' && mapa) setTimeout(function () { mapa.invalidateSize(); }, 50);
}

/* ---------- busca ---------- */
function gcsDoFiltro() {
  return dados.gcs.filter(function (g) {
    return (!diasFiltro.length || diasFiltro.indexOf(diaDoGc(g)) !== -1) &&
           (!tiposFiltro.length || tiposFiltro.indexOf(g.tipo) !== -1);
  });
}
function textoDias() {
  if (!diasFiltro.length) return '';
  var nomes = diasFiltro.map(function (d) { return (d === 'Sábado' || d === 'Domingo' ? 'no ' : 'na ') + d.toLowerCase(); });
  return nomes.length === 1 ? nomes[0] : nomes.slice(0, -1).join(', ') + ' ou ' + nomes[nomes.length - 1];
}
function textoTipos() {
  if (!tiposFiltro.length) return '';
  var n = tiposFiltro.map(function (x) { return x.toLowerCase(); });
  return 'de ' + (n.length === 1 ? n[0] : n.slice(0, -1).join(', ') + ' ou ' + n[n.length - 1]);
}
function msgNenhum() {
  return 'Nenhum GC' + (tiposFiltro.length ? ' ' + textoTipos() : '') + ' cadastrado' + (diasFiltro.length ? ' ' + textoDias() : '') + '.';
}
async function calcularResultado(loc) {
  var ranking = gcsDoFiltro().map(function (g) { return { gc: g, km: distancia(loc.coord, g) }; })
                             .sort(function (a, b) { return a.km - b.km; });
  var comRotas = await aplicarRotas(loc.coord, ranking);
  ultimaBusca = { loc: loc, ranking: comRotas.ranking, comRota: comRotas.comRota };
  renderResultado();
}
/* ao marcar/desmarcar um dia com um resultado na tela, refaz o ranking sem buscar o endereço de novo */
function alternarNaLista(lista, valor, ordem) {
  var i = lista.indexOf(valor);
  if (i === -1) lista.push(valor); else lista.splice(i, 1);
  lista.sort(function (a, b) { return ordem.indexOf(a) - ordem.indexOf(b); });
}
async function alternarDia(d) { alternarNaLista(diasFiltro, d, DIAS); await atualizarFiltros(); }
async function alternarTipo(x) { alternarNaLista(tiposFiltro, x, TIPOS); await atualizarFiltros(); }
/* com um resultado na tela, refaz o ranking sem buscar o endereço de novo */
async function atualizarFiltros() {
  document.querySelectorAll('[data-dia]').forEach(function (b) { b.setAttribute('aria-pressed', diasFiltro.indexOf(b.dataset.dia) !== -1 ? 'true' : 'false'); });
  document.querySelectorAll('[data-tipo]').forEach(function (b) { b.setAttribute('aria-pressed', tiposFiltro.indexOf(b.dataset.tipo) !== -1 ? 'true' : 'false'); });
  if (!ultimaBusca) return;
  var loc = ultimaBusca.loc;
  msg('b-msg', '');
  if (!gcsDoFiltro().length) { $('b-res').innerHTML = ''; msg('b-msg', msgNenhum(), true); return; }
  $('b-res').innerHTML = '<p class="msg">Atualizando...</p>';
  await calcularResultado(loc);
}

async function buscar() {
  msg('b-msg', ''); $('b-res').innerHTML = '';
  if (!dados.gcs.length) { msg('b-msg', 'Nenhum GC cadastrado ainda. Adicione os GCs na aba GCs.', true); return; }
  if (!gcsDoFiltro().length) { msg('b-msg', msgNenhum(), true); return; }
  var btn = $('b-ir'); btn.disabled = true; btn.textContent = 'Buscando...';
  try {
    var cep = $('b-cep').value, rua = $('b-rua').value.trim(), num = $('b-num').value.trim(), cidade = $('b-cidade').value.trim();
    var loc = null;
    if (rua && cidade) {
      var res = await geocodificarEndereco(rua, num, cidade);
      if (res.length) {
        var s = resumoEndereco(res[0]);
        var linha1 = s.temNumero || !num ? s.linha1 : s.linha1 + ', ' + num;
        loc = { coord: { lat: +res[0].lat, lng: +res[0].lon }, texto: linha1 + (s.linha2 ? ' - ' + s.linha2 : ''),
                precisao: s.temNumero ? 'numero' : 'rua', numPedido: num };
      }
    }
    if (!loc && digitos(cep).length === 8) loc = await localizar(cep, num);
    if (!loc) throw new Error(rua || cidade ? 'Não achei esse endereço. Confira a rua e a cidade, ou use o CEP.' : 'Informe o CEP ou a rua e a cidade.');
    btn.textContent = 'Calculando trajetos...';
    await calcularResultado(loc);
  } catch (e) {
    msg('b-msg', e.message === 'Failed to fetch' ? 'Não consegui acessar a busca de CEP. Verifique a internet e tente de novo.' : e.message, true);
  } finally { btn.disabled = false; btn.textContent = 'Buscar GC mais próximo'; }
}

/* ---------- distância pelo trajeto (OpenStreetMap / OSRM) ---------- */
function minutos(seg) {
  var m = Math.round(seg / 60);
  return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');
}
async function rotaOsrm(perfil, a, b, comLinha) {
  var srv = perfil === 'pe' ? 'routed-foot/route/v1/driving/' : 'routed-car/route/v1/driving/';
  var url = 'https://routing.openstreetmap.de/' + srv + a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat +
            '?overview=' + (comLinha ? 'full&geometries=geojson' : 'false');
  var ctl = new AbortController(), tempo = setTimeout(function () { ctl.abort(); }, 8000);
  try {
    var r = await fetch(url, { signal: ctl.signal });
    var d = await r.json();
    if (d.code !== 'Ok' || !d.routes || !d.routes[0]) return null;
    var rt = d.routes[0];
    return { km: rt.distance / 1000, seg: rt.duration, linha: comLinha ? rt.geometry.coordinates : null };
  } catch (e) { return null; } finally { clearTimeout(tempo); }
}
/* calcula o trajeto de carro para os 5 GCs mais próximos em linha reta e reordena pelo trajeto */
async function aplicarRotas(origem, ranking) {
  var candidatos = ranking.slice(0, 5);
  var rotas = await Promise.all(candidatos.map(function (x) { return rotaOsrm('carro', origem, x.gc, true); }));
  candidatos.forEach(function (x, i) { x.carro = rotas[i]; });
  var algum = rotas.some(function (r) { return r; });
  if (algum) {
    candidatos.sort(function (a, b) { return (a.carro ? a.carro.km : 1e9) - (b.carro ? b.carro.km : 1e9); });
    candidatos[0].pe = await rotaOsrm('pe', origem, candidatos[0].gc, false);
  }
  return { ranking: candidatos.concat(ranking.slice(5)), comRota: algum };
}

function renderResultado() {
  var r = ultimaBusca, top = r.ranking[0], g = top.gc, o = r.loc.coord;
  var rota = 'https://www.google.com/maps/dir/?api=1&origin=' + o.lat + ',' + o.lng + '&destination=' + g.lat + ',' + g.lng;
  var tel = digitos($('b-tel').value), nome = $('b-nome').value.trim();
  var texto = 'Olá' + (nome ? ' ' + nome.split(' ')[0] : '') + '! O GC mais perto de você é o ' + g.nome + (g.tipo ? ' (GC de ' + g.tipo.toLowerCase() + ')' : '') +
              (g.quando ? ', ' + g.quando : '') + (g.lider ? ', com ' + g.lider : '') + '. Endereço: ' + g.endereco + '. Rota: ' + rota;
  var wpp = 'https://wa.me/' + (tel ? (tel.length <= 11 ? '55' + tel : tel) : '') + '?text=' + encodeURIComponent(texto);
  var aviso = r.comRota ? '' : '<p class="aviso">Não consegui calcular o trajeto agora, então mostrei a distância em linha reta. Toque em "Como chegar" para ver o caminho.</p>';
  if (r.loc.precisao === 'bairro' || r.loc.precisao === 'cidade')
    aviso += '<p class="aviso">Localizei só pelo ' + r.loc.precisao + ' deste CEP, então a distância é aproximada. Coloque a rua e o número para ficar mais certo.</p>';
  else if (r.loc.precisao === 'rua' && r.loc.numPedido)
    aviso += '<p class="aviso">O mapa não tem o número ' + esc(r.loc.numPedido) + ' dessa rua, usei o meio da rua para calcular.</p>';

  var html =
    '<div class="placar">' +
      '<div class="topo"><p class="de">GC ' + (tiposFiltro.length ? esc(textoTipos()) + ' ' : '') + 'mais próximo ' + (diasFiltro.length ? esc(textoDias()) + ' ' : '') + 'de ' + esc(r.loc.texto) + '</p>' +
        '<h2>' + esc(g.nome) + '</h2>' +
        (g.tipo ? '<p class="info">GC de ' + esc(g.tipo) + '</p>' : '') +
        (g.lider ? '<p class="info">Líder: ' + esc(g.lider) + '</p>' : '') +
        (g.quando ? '<p class="info">' + esc(g.quando) + '</p>' : '') +
        '<p class="info">' + esc(g.endereco) + '</p></div>' +
      (top.carro
        ? '<div class="faixa"><span class="km">' + km(top.carro.km) + '</span><span>km de carro, cerca de ' + minutos(top.carro.seg) + '</span>' +
            '<span class="extra">' + km(top.km) + ' km em linha reta' + (top.pe ? ', ' + km(top.pe.km) + ' km a pé (cerca de ' + minutos(top.pe.seg) + ')' : '') + '</span></div>'
        : '<div class="faixa"><span class="km">' + km(top.km) + '</span><span>km em linha reta</span></div>') +
      '<div class="acoes"><a class="btn" href="' + rota + '" target="_blank" rel="noopener">Como chegar</a>' +
        '<a class="btn" href="' + wpp + '" target="_blank" rel="noopener">Enviar no WhatsApp</a></div>' +
    '</div>' + aviso +
    '<button class="btn ouro" id="b-salvar">Salvar pessoa neste GC</button>' +
    '<div id="mapa" class="mapa"></div>';

  if (r.ranking.length > 1) {
    html += '<h3>Outras opções</h3>' + (r.comRota ? '<p class="aviso" style="margin-top:0">Distância de carro pelo trajeto.</p>' : '') + '<ul class="lista">' + r.ranking.slice(1, 4).map(function (x) {
      return '<li><div><strong>' + esc(x.gc.nome) + '</strong><span class="sub">' + esc(x.gc.quando || x.gc.endereco) + '</span></div><span class="dist">' + km(x.carro ? x.carro.km : x.km) + ' km</span></li>';
    }).join('') + '</ul>';
  }
  $('b-res').innerHTML = html;
  $('b-salvar').addEventListener('click', salvarPessoa);
  desenharMapa(o, r.ranking);
}

function desenharMapa(origem, ranking) {
  if (!window.L) { $('mapa').remove(); return; }
  if (mapa) { mapa.remove(); mapa = null; }
  mapa = novoMapa('mapa');
  ranking.forEach(function (x, i) { marcarGc(mapa, x.gc, i === 0); });
  L.circleMarker([origem.lat, origem.lng], { radius: 9, color: corMapa('--mapa-contorno', '#000'), fillColor: corMapa('--mapa-pessoa', '#fff'), fillOpacity: 1, weight: 3 }).addTo(mapa).bindPopup('Pessoa');
  var foco = [[origem.lat, origem.lng], [ranking[0].gc.lat, ranking[0].gc.lng]];
  if (ranking[0].carro && ranking[0].carro.linha) {
    var linha = ranking[0].carro.linha.map(function (c) { return [c[1], c[0]]; });
    L.polyline(linha, { color: corMapa('--mapa-rota', '#000'), weight: 5, opacity: .8 }).addTo(mapa);
    foco = linha;
  }
  mapa.fitBounds(foco, { padding: [40, 40], maxZoom: 15 });
}

async function salvarPessoa() {
  var r = ultimaBusca, nome = $('b-nome').value.trim();
  if (!nome) { msg('b-msg', 'Preencha o nome para salvar a pessoa.', true); $('b-nome').focus(); return; }
  var p = { id: uid(), nome: nome, tel: $('b-tel').value.trim(), cep: $('b-cep').value,
    endereco: r.loc.texto, gcId: r.ranking[0].gc.id, km: r.ranking[0].carro ? r.ranking[0].carro.km : r.ranking[0].km, kmReta: r.ranking[0].km, em: new Date().toISOString() };
  try { await gravar('pessoas', p); } catch (e) { msg('b-msg', erroFirebase(e), true); return; }
  dados.pessoas.unshift(p);
  msg('b-msg', nome + ' foi salvo no ' + r.ranking[0].gc.nome + '.');
  ['b-cep', 'b-rua', 'b-nome', 'b-num', 'b-tel'].forEach(function (id) { $(id).value = ''; });
  $('b-res').innerHTML = ''; ultimaBusca = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- pessoas ---------- */
function nomeGc(id) { var g = dados.gcs.find(function (x) { return x.id === id; }); return g ? g.nome : 'GC removido'; }
function renderPessoas() {
  var f = $('p-filtro'), atual = f.value;
  f.innerHTML = '<option value="">Todos os GCs</option>' + dados.gcs.map(function (g) { return '<option value="' + g.id + '">' + esc(g.nome) + '</option>'; }).join('');

  var lista = dados.pessoas.filter(function (p) { return !f.value || p.gcId === f.value; });

    return '<li><div><strong>' + esc(p.nome) + '</strong><span class="sub">' + esc(nomeGc(p.gcId)) + ' – ' + km(p.km) + ' km' + (p.tel ? ' – ' + esc(p.tel) : '') + '</span></div>' +
           '<button class="x" data-del-pessoa="' + p.id + '">Remover</button></li>';
  }).join('') : '<li class="vazio" style="display:block">Ninguém salvo ainda. Busque um CEP e toque em "Salvar pessoa neste GC".</li>';
}

/* ---------- GCs ---------- */
function resumoEndereco(r) {
  var a = r.address || {};
  var rua = a.road || a.pedestrian || a.residential || (r.display_name || '').split(',')[0];
  var linha1 = rua + (a.house_number ? ', ' + a.house_number : '');
  var bairro = a.suburb || a.neighbourhood || a.quarter || a.city_district || '';
  var cidade = a.city || a.town || a.village || a.municipality || '';
  var uf = (a['ISO3166-2-lvl4'] || '').replace('BR-', '');
  return { linha1: linha1, linha2: [bairro, cidade + (uf ? '/' + uf : '')].filter(Boolean).join(' - '), temNumero: !!a.house_number };
}

async function geocodificarEndereco(rua, num, cidade) {
  var base = { format: 'json', addressdetails: '1', countrycodes: 'br', limit: '5' };
  var q = new URLSearchParams(Object.assign({}, base, { q: rua + (num ? ', ' + num : '') + ', ' + cidade }));
  var res = await buscarJson('https://nominatim.openstreetmap.org/search?' + q.toString());
  if (!res.length && num) {
    q = new URLSearchParams(Object.assign({}, base, { q: rua + ', ' + cidade }));
    res = await buscarJson('https://nominatim.openstreetmap.org/search?' + q.toString());
  }
  return res;
}

/* CEP preenche rua e cidade (prefixo 'b' = Buscar, 'g' = GCs) */
function autoCep(p) {
  $(p + '-cep').addEventListener('input', async function () {
    var cep = digitos(this.value);
    if (cep.length !== 8) return;
    var alvoMsg = p + '-msg';
    try {
      var e = await enderecoDoCep(cep);
      if (e.rua) $(p + '-rua').value = e.rua;
      if (e.cidade) $(p + '-cidade').value = e.cidade + (e.uf ? ', ' + e.uf : '');
      msg(alvoMsg, e.rua ? '' : 'Esse CEP é da cidade toda. Digite o nome da rua.');
      if (p === 'g') resetEnderecoGc();
      (e.rua ? $(p + '-num') : $(p + '-rua')).focus();
    } catch (x) {
      msg(alvoMsg, x.message === 'Failed to fetch' ? 'Não consegui consultar o CEP agora.' : 'CEP não encontrado.', true);
    }
  });
}

async function acharEnderecoGc() {
  var rua = $('g-rua').value.trim(), num = $('g-num').value.trim(), cidade = $('g-cidade').value.trim();
  msg('g-msg', ''); resetEnderecoGc();
  if (!rua || !cidade) { msg('g-msg', 'Preencha a rua e a cidade.', true); return; }
  var btn = $('g-achar'); btn.disabled = true; btn.textContent = 'Localizando...';
  try {
    var res = await geocodificarEndereco(rua, num, cidade);
    if (!res.length) throw new Error('Não achei esse endereço. Confira o nome da rua e a cidade.');
    opcoesEndereco = res.map(function (r) {
      var s = resumoEndereco(r);
      return { lat: +r.lat, lng: +r.lon, texto: s.linha1 + (s.linha2 ? ' - ' + s.linha2 : ''), s: s };
    });
    $('g-opcoes').innerHTML = '<div class="opcoes"><p>' + (opcoesEndereco.length > 1 ? 'Toque no endereço certo' : 'Endereço encontrado') + '</p>' +
      opcoesEndereco.map(function (o, i) {
        return '<button class="opcao" data-opcao="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(o.s.linha1) + '<small>' + esc(o.s.linha2) + '</small></button>';
      }).join('') + '</div>';
    escolherEndereco(0);
    if (num && !opcoesEndereco[0].s.temNumero)
      msg('g-msg', 'O mapa não tem o número ' + num + ' dessa rua. O GC vai ficar marcado no meio da rua, o que já serve para calcular a distância.');
  } catch (e) {
    msg('g-msg', e.message === 'Failed to fetch' ? 'Não consegui acessar a busca de endereço. Verifique a internet e tente de novo.' : e.message, true);
  } finally { btn.disabled = false; btn.textContent = 'Localizar endereço'; }
}

function escolherEndereco(i) {
  enderecoEscolhido = opcoesEndereco[i];
  document.querySelectorAll('.opcao').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.opcao == i ? 'true' : 'false'); });
  $('g-add').hidden = false;
}

function resetEnderecoGc() {
  enderecoEscolhido = null; $('g-opcoes').innerHTML = '';
  if (!editando) $('g-add').hidden = true;
}
function limparFormGc() {
  ['g-nome', 'g-tipo', 'g-lider', 'g-dia', 'g-hora', 'g-cep', 'g-rua', 'g-num'].forEach(function (id) { $(id).value = ''; });
  $('g-opcoes').innerHTML = ''; enderecoEscolhido = null;
}
/* separa "Rua X, 123 - Bairro - Cidade/UF" para GCs antigos que não guardaram rua e cidade separadas */
function partesEndereco(g) {
  if (g.rua) return { rua: g.rua, num: g.num || '', cidade: g.cidade || '' };
  var p = (g.endereco || '').split(' - '), r = p[0] || '', num = '';
  var m = r.match(/^(.*),\s*(\d+\w*)$/); if (m) { r = m[1]; num = m[2]; }
  var c = p.length > 1 ? p[p.length - 1].replace('/', ', ') : '';
  return { rua: r, num: num, cidade: c };
}
function entrarEdicao(id) {
  var g = dados.gcs.find(function (x) { return x.id === id; }); if (!g) return;
  limparFormGc();
  var e = partesEndereco(g);
  editando = { id: id, rua: e.rua, num: e.num, cidade: e.cidade };
  $('g-nome').value = g.nome || ''; $('g-lider').value = g.lider || '';
  $('g-dia').value = diaDoGc(g);
  $('g-tipo').value = g.tipo || '';
  var h = g.hora || ((g.quando || '').match(/(\d{1,2})[:h](\d{2})?/) ? (function (m) { return m[1].padStart(2, '0') + ':' + (m[2] || '00'); })((g.quando || '').match(/(\d{1,2})[:h](\d{2})?/)) : '');
  $('g-hora').value = h; if ($('g-hora').value !== h) $('g-hora').value = '';
  $('g-cep').value = g.cep || ''; $('g-rua').value = e.rua; $('g-num').value = e.num; $('g-cidade').value = e.cidade;
  $('g-editando').textContent = 'Editando: ' + g.nome; $('g-editando').hidden = false;
  $('g-add').textContent = 'Salvar alterações'; $('g-add').hidden = false; $('g-cancelar').hidden = false;
  msg('g-msg', 'Se mudar o endereço, toque em "Localizar endereço" antes de salvar.');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function sairEdicao() {
  editando = null; limparFormGc();
  $('g-editando').hidden = true; $('g-cancelar').hidden = true;
  $('g-add').textContent = 'Adicionar GC'; $('g-add').hidden = true;
}

async function adicionarGc() {
  var nome = $('g-nome').value.trim(), dia = $('g-dia').value, hora = $('g-hora').value;
  var rua = $('g-rua').value.trim(), num = $('g-num').value.trim(), cidade = $('g-cidade').value.trim();
  if (!nome) { msg('g-msg', 'Dê um nome ao GC.', true); $('g-nome').focus(); return; }
  var tipo = $('g-tipo').value;
  if (!tipo) { msg('g-msg', 'Escolha o tipo do GC.', true); $('g-tipo').focus(); return; }
  if (!dia) { msg('g-msg', 'Escolha o dia da semana do GC.', true); $('g-dia').focus(); return; }
  var campos = { nome: nome, tipo: tipo, lider: $('g-lider').value.trim(), dia: dia, hora: hora, quando: quandoDe(dia, hora),
                 cep: $('g-cep').value, rua: rua, num: num, cidade: cidade };
  var e = enderecoEscolhido;
  if (e) {
    campos.endereco = e.s.temNumero || !num ? e.texto : e.s.linha1 + ', ' + num + (e.s.linha2 ? ' - ' + e.s.linha2 : '');
    campos.lat = e.lat; campos.lng = e.lng;
  }
  var g;
  if (editando) {
    var mudou = rua !== editando.rua || num !== editando.num || cidade !== editando.cidade;
    if (mudou && !e) { msg('g-msg', 'O endereço mudou. Toque em "Localizar endereço" para confirmar antes de salvar.', true); return; }
    var atual = dados.gcs.find(function (x) { return x.id === editando.id; });
    g = Object.assign({}, atual, campos);
  } else {
    if (!e) { msg('g-msg', 'Localize o endereço antes de adicionar.', true); return; }
    g = Object.assign({ id: uid() }, campos);
  }
  var btn = $('g-add'); btn.disabled = true;
  try { await gravar('gcs', g); } catch (x) { msg('g-msg', erroFirebase(x), true); btn.disabled = false; return; }
  btn.disabled = false;
  var eraEdicao = !!editando;
  if (eraEdicao) dados.gcs = dados.gcs.map(function (x) { return x.id === g.id ? g : x; });
  else dados.gcs.push(g);
  try { localStorage.setItem('gc-finder-cidade', cidade); } catch (x) {}
  sairEdicao();
  $('g-cidade').value = cidade;
  msg('g-msg', nome + (eraEdicao ? ' atualizado.' : ' adicionado.'));
  ultimaBusca = null; $('b-res').innerHTML = '';
  renderGcs();
}

function renderGcs() {
  $('g-lista').innerHTML = dados.gcs.length ? dados.gcs.map(function (g) {
    var n = dados.pessoas.filter(function (p) { return p.gcId === g.id; }).length;
    return '<li><div><strong>' + esc(g.nome) + '</strong><span class="sub">' + (g.lider ? 'Líder: ' + esc(g.lider) + '<br>' : '') + [g.tipo ? 'GC de ' + esc(g.tipo) : '', esc(g.quando || '')].filter(Boolean).join(', ') + '<br>' + esc(g.endereco) + '<br>' +
           n + (n === 1 ? ' pessoa' : ' pessoas') + '</span></div>' +
           '<div class="acoes-item"><button class="x editar" data-edit-gc="' + g.id + '">Editar</button>' +
           '<button class="x" data-del-gc="' + g.id + '">Remover</button></div></li>';
  }).join('') : '<li class="vazio" style="display:block">Nenhum GC ainda. Cadastre o primeiro acima.</li>';
}

function novoMapa(id) {
  var m = L.map(id, { scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(m);
  return m;
}
function marcarGc(m, g, destaque) {
  L.circleMarker([g.lat, g.lng], { radius: destaque ? 11 : 8, color: corMapa('--mapa-contorno', '#000'), fillColor: destaque ? corMapa('--mapa-destaque', '#C9A227') : corMapa('--mapa-outro', '#8A8A8A'), fillOpacity: 1, weight: 2 })
    .addTo(m).bindPopup('<strong>' + esc(g.nome) + '</strong>' + (g.tipo ? '<br>GC de ' + esc(g.tipo) : '') + (g.quando ? '<br>' + esc(g.quando) : '') +
      (g.lider ? '<br>Líder: ' + esc(g.lider) : '') + '<br>' + esc(g.endereco));
}
function desenharMapaTodos() {
  var el = $('mapa-todos'), n = dados.gcs.length;
  $('m-info').textContent = n ? n + (n === 1 ? ' GC cadastrado. Toque num ponto para ver os detalhes.' : ' GCs cadastrados. Toque num ponto para ver os detalhes.')
                              : 'Nenhum GC cadastrado ainda. Cadastre na aba GCs.';
  if (!window.L || !n) { el.hidden = true; return; }
  el.hidden = false;
  if (mapaGcs) { mapaGcs.remove(); mapaGcs = null; }
  mapaGcs = novoMapa('mapa-todos');
  dados.gcs.forEach(function (g) { marcarGc(mapaGcs, g, true); });
  mapaGcs.fitBounds(dados.gcs.map(function (g) { return [g.lat, g.lng]; }), { padding: [30, 30], maxZoom: 15 });
}

/* ---------- eventos ---------- */
document.addEventListener('click', async function (ev) {
  var t = ev.target;
  var op = t.closest && t.closest('[data-opcao]');
  if (op) escolherEndereco(+op.dataset.opcao);
  if (t.dataset.aba) trocarAba(t.dataset.aba);
  if (t.dataset.editGc) entrarEdicao(t.dataset.editGc);
  if (t.dataset.dia) alternarDia(t.dataset.dia);
  if (t.dataset.tipo) alternarTipo(t.dataset.tipo);
  if (t.dataset.delGc && confirm('Remover este GC?')) {
    if (editando && editando.id === t.dataset.delGc) sairEdicao();
    try { await apagar('gcs', t.dataset.delGc); } catch (e) { alert(erroFirebase(e)); return; }
    dados.gcs = dados.gcs.filter(function (g) { return g.id !== t.dataset.delGc; }); renderGcs();
  }
  if (t.dataset.delPessoa && confirm('Remover esta pessoa?')) {
    try { await apagar('pessoas', t.dataset.delPessoa); } catch (e) { alert(erroFirebase(e)); return; }
    dados.pessoas = dados.pessoas.filter(function (p) { return p.id !== t.dataset.delPessoa; }); renderPessoas();
  }
});
$('b-ir').addEventListener('click', buscar);
['b-rua', 'b-num', 'b-cidade'].forEach(function (id) { $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') buscar(); }); });
$('g-add').addEventListener('click', adicionarGc);
$('p-filtro').addEventListener('change', renderPessoas);
montarSelects();
mascaraCep($('b-cep')); mascaraCep($('g-cep'));
autoCep('b'); autoCep('g');
$('g-achar').addEventListener('click', acharEnderecoGc);
$('g-rua').addEventListener('keydown', function (e) { if (e.key === 'Enter') acharEnderecoGc(); });
['g-rua', 'g-num', 'g-cidade'].forEach(function (id) { $(id).addEventListener('input', resetEnderecoGc); });
$('g-cancelar').addEventListener('click', function () { sairEdicao(); msg('g-msg', ''); });

/* ---------- login ---------- */
function mostrarTela(qual) {
  $('tela-carregando').hidden = qual !== 'carregando';
  $('tela-login').hidden = qual !== 'login';
  $('app').hidden = qual !== 'app';
  $('sair').hidden = qual !== 'app';
}

$('f-login').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  msg('l-msg', '');
  var btn = $('l-entrar'); btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    await signInWithEmailAndPassword(auth, $('l-email').value.trim(), $('l-senha').value);
  } catch (e) {
    var c = e.code || '';
    msg('l-msg', c === 'auth/too-many-requests' ? 'Muitas tentativas. Espere alguns minutos e tente de novo.'
      : c === 'auth/network-request-failed' ? 'Sem conexão com o servidor. Verifique a internet.'
      : 'E-mail ou senha incorretos.', true);
  } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
});

$('sair').addEventListener('click', function () { signOut(auth); });

onAuthStateChanged(auth, async function (user) {
  if (!user) {
    dados = { gcs: [], pessoas: [] };
    $('b-res').innerHTML = ''; $('l-senha').value = '';
    mostrarTela('login');
    return;
  }
  mostrarTela('carregando');
  try {
    await carregar();
  } catch (e) {
    await signOut(auth);
    msg('l-msg', e.code === 'permission-denied' ? 'Esta conta não tem acesso aos dados.' : 'Não consegui carregar os dados. Tente de novo.', true);
    return;
  }
  try { var c = localStorage.getItem('gc-finder-cidade'); if (c) $('g-cidade').value = c; } catch (x) {}
  mostrarTela('app');
  trocarAba('buscar');
});
</script>
